<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DVB Fahrer-Checklisten</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="header-top">
            <h1>DVB Checklisten</h1>
            <div class="nav-buttons">
                <button id="btnNavMenu" class="btn-nav active" onclick="showMenu()">Hauptmenü</button>
                <button id="btnNavLocations" class="btn-nav" onclick="showLocations()">Betriebsstellen</button>
                <button id="btnNavMap" class="btn-nav" onclick="showMap()">Netzplan</button>
            </div>
        </div>
        <div class="filters">
            <div class="filter-group">
                <label>Fahrzeug:</label>
                <select id="tramType" onchange="updateFilters()">
                    <option value="NGT6DD">NGT6DD</option>
                    <option value="NGT8DD">NGT8DD</option>
                    <option value="NGTD8DD">NGTD8DD</option>
                    <option value="NGTD12DD">NGTD12DD</option>
                    <option value="NGTDXDD">NGTDXDD</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Ausrücken:</label>
                <select id="startDepot" onchange="updateFilters()">
                    <option value="Gorbitz">Gorbitz</option>
                    <option value="Reick">Reick</option>
                    <option value="Trachenberge">Trachenberge</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Einrücken:</label>
                <select id="endDepot" onchange="updateFilters()">
                    <option value="Gorbitz">Gorbitz</option>
                    <option value="Reick">Reick</option>
                    <option value="Trachenberge">Trachenberge</option>
                </select>
            </div>
        </div>
    </header>

    <main>
        <!-- ANSICHT 1: HAUPTMENÜ -->
        <div id="view-menu" class="view active">
            <div class="menu-section-title">Standard- & Störungs-Checklisten</div>
            <div id="menuContainer"></div>
        </div>

        <!-- ANSICHT 2: BETRIEBSSTELLEN -->
        <div id="view-locations" class="view">
            <div class="menu-section-title">Hinweise zu Betriebsstellen</div>
            <div id="locationsContainer"></div>
        </div>

        <!-- ANSICHT 3: DETAIL-CHECKLISTE -->
        <div id="view-checklist" class="view">
            <h2 class="checklist-title" id="currentChecklistTitle">Titel</h2>
            <div id="checklistContainer"></div>
        </div>
         <!-- NEU: ANSICHT 4: KARTEN -->
        <div id="view-map" class="view">
            <div class="menu-section-title">DVB Liniennetz</div>
            
            <!-- Umschalter -->
            <div class="map-toggle">
                <button id="btnInteractiveMap" class="toggle-btn active" onclick="switchMapMode('interactive')">Interaktiv (OSM)</button>
                <button id="btnStaticMap" class="toggle-btn" onclick="switchMapMode('static')">Offizieller Netzplan</button>
            </div>

            <!-- INTERAKTIVE KARTE -->
            <div id="interactiveWrapper">
                <div class="map-controls">
                    <label for="lineFilter">Linie auswählen:</label>
                    <select id="lineFilter" onchange="filterMapLines()">
                        <option value="all">Alle Linien anzeigen</option>
                    </select>
                </div>
                <div id="mapContainer"></div>
            </div>

            <!-- STATISCHES BILD (Offizieller Plan) -->
            <div id="staticMapContainer" style="display:none;">
                <img src="netzplan.jpg" alt="DVB Offizieller Netzplan" class="static-map-img">
            </div>
        </div>
    </main>

    <!-- SCHWEBENDER ZURÜCK-BUTTON -->
    <button id="fabBack" class="fab-back" onclick="goBack()">◀ Zurück</button>

    <!-- 1. Konfiguration -->
    <script src="js/config.js"></script>

    <!-- 2. Checklisten-Daten -->
    <script src="js/data/aufruesten.js"></script>
    <script src="js/data/einruecken.js"></script>
    <script src="js/data/abruesten.js"></script>
    <script src="js/data/stoerungen.js"></script>
    <script src="js/data/betriebsstellen.js"></script>
    <script src="js/data/sonstiges.js"></script>
    <script src="js/map.js"></script>

    <!-- 3. Haupt-App-Logik -->
    <script src="js/app.js"></script>
</body>
</html>
